name: CI

# 為什麼要有這個：目前 PR 只跑 Vercel 建置（不跑測試），
# 所以測試檔語法壞掉也能合併進 develop（v1.2.0 就發生過一次）。
# 這裡讓每個 PR 都真的跑 npm test 與 npm run check。

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 語法檢查
        run: npm run check

      - name: 測試
        run: npm test

      - name: Service Worker 預載清單
        run: node scripts/build-sw.mjs --check
